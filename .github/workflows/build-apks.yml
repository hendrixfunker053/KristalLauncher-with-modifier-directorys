
name: Build Kristal Launcher APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Debug and Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) {
            throw "ANDROID_HOME is not configured"
          }

          $sdkManager = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $sdkManager)) {
            throw "Android SDK Manager not found"
          }

          "y`ny`ny`ny`ny`ny`ny`ny`n" |
            & $sdkManager --licenses

          & $sdkManager `
            "platforms;android-34" `
            "build-tools;34.0.0"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK installation failed"
          }

      - name: Generate signing keystore
        shell: pwsh
        run: |
          ./scripts/create-project-keystore.ps1

      - name: Build both APK variants
        shell: pwsh
        run: |
          ./scripts/build-apks.ps1 -Variant All

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KristalLauncher-APKs
          path: artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 14
