
name: Build KristalLauncher APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: pwsh
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore signing configuration
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "Missing KEYSTORE_BASE64 secret"
          }

          New-Item -ItemType Directory -Force .signing | Out-Null

          [IO.File]::WriteAllBytes(
            ".signing/ci-keystore.jks",
            [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          )

          @"
          storeFile=.signing/ci-keystore.jks
          storePassword=$($env:STORE_PASSWORD)
          keyAlias=$($env:KEY_ALIAS)
          keyPassword=$($env:KEY_PASSWORD)
          "@ | Set-Content ".signing/keystore.properties" -Encoding ASCII

      - name: Build Debug and Release APKs
        shell: pwsh
        run: |
          .\scripts\build-apks.ps1 -Variant All

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KristalLauncher-APKs
          path: artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 30
