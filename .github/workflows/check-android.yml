
name: Check Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check Kristal Launcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK requirements
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Check InstalledKristalRuntime declaration
        shell: bash
        run: |
          echo "Searching for InstalledKristalRuntime..."
          if git grep -nE \
            '(data class|class|typealias)[[:space:]]+InstalledKristalRuntime' \
            -- '*.kt'; then
            echo "Declaration found."
          else
            echo "::warning::InstalledKristalRuntime declaration was not found."
          fi

      - name: Grant Gradle execution permission
        run: chmod +x ./gradlew

      - name: Build Android layer
        run: ./gradlew assembleDebug --no-daemon
